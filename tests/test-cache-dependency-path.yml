name: Test Haxe setup with cache-dependency-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a dependency file for caching
        run: |
          mkdir -p tests/fixtures
          echo '{}' > tests/fixtures/haxe.hxml
      - id: setup-haxe
        uses: .
        with:
          haxe-version: '4.3.7'
          cache-dependency-path: 'tests/fixtures/haxe.hxml'
      - name: Assert haxe is on PATH after setup with cache-dependency-path
        run: |
          echo "Checking haxe binary..."
          if ! command -v haxe >/dev/null 2>&1; then
            echo "FAIL: haxe not found on PATH"
            exit 1
          fi
          echo "PASS: haxe found on PATH"
      - name: Assert haxe version matches
        run: |
          ACTUAL=$(haxe --version 2>&1 | head -1)
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "4.3.7"; then
            echo "PASS: haxe version 4.3.7 confirmed with cache-dependency-path"
          else
            echo "FAIL: expected version 4.3.7 but got: $ACTUAL"
            exit 1
          fi
