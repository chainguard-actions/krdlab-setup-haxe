name: Test Haxe setup with cache-dependency-path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a hxml dependency file
        run: |
          cat > "$GITHUB_WORKSPACE/build.hxml" <<'EOF'
          -cp src
          -main Main
          -js bin/main.js
          EOF
          echo "Created build.hxml"
      - id: setup-haxe
        uses: .
        with:
          haxe-version: '4.3.1'
          cache-dependency-path: 'build.hxml'
      - name: Assert haxe is on PATH
        run: |
          echo "Checking haxe is available on PATH..."
          if ! command -v haxe >/dev/null 2>&1; then
            echo "FAIL: haxe not found on PATH"
            exit 1
          fi
          echo "PASS: haxe found on PATH"
      - name: Assert haxe version with cache-dependency-path
        run: |
          ACTUAL=$(haxe --version 2>&1 || true)
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "4.3.1"; then
            echo "PASS: haxe version 4.3.1 installed correctly with cache-dependency-path"
          else
            echo "FAIL: expected haxe version 4.3.1 but got: $ACTUAL"
            exit 1
          fi
      - name: Assert haxelib is functional
        run: |
          echo "Checking haxelib version..."
          HAXELIB_VER=$(haxelib version 2>&1 || true)
          echo "haxelib version: $HAXELIB_VER"
          if [ -z "$HAXELIB_VER" ]; then
            echo "FAIL: haxelib returned empty output"
            exit 1
          fi
          echo "PASS: haxelib is functional"
