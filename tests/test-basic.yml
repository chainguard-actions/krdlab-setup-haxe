name: Test basic Haxe setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-haxe
        uses: .
        with:
          haxe-version: '4.3.1'
      - name: Assert haxe is on PATH
        run: |
          echo "Checking haxe is available on PATH..."
          if ! command -v haxe >/dev/null 2>&1; then
            echo "FAIL: haxe not found on PATH"
            exit 1
          fi
          echo "PASS: haxe found on PATH"
      - name: Assert haxe version
        run: |
          ACTUAL=$(haxe --version 2>&1 || true)
          echo "actual: $ACTUAL"
          if echo "$ACTUAL" | grep -q "4.3.1"; then
            echo "PASS: haxe version matches 4.3.1"
          else
            echo "FAIL: expected haxe version 4.3.1 but got: $ACTUAL"
            exit 1
          fi
      - name: Assert haxelib is on PATH
        run: |
          echo "Checking haxelib is available on PATH..."
          if ! command -v haxelib >/dev/null 2>&1; then
            echo "FAIL: haxelib not found on PATH"
            exit 1
          fi
          echo "PASS: haxelib found on PATH"
