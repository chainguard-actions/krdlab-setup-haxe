name: Test default Haxe version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-haxe
        uses: .
        with:
          haxe-version: '4.3.7'
      - name: Assert haxe is available with default version
        run: |
          echo "Checking haxe binary with default version..."
          if ! command -v haxe >/dev/null 2>&1; then
            echo "FAIL: haxe not found on PATH"
            exit 1
          fi
          ACTUAL=$(haxe --version 2>&1 | head -1)
          echo "actual version: $ACTUAL"
          if echo "$ACTUAL" | grep -q "4.3.7"; then
            echo "PASS: default haxe version 4.3.7 is installed"
          else
            echo "FAIL: expected default version 4.3.7 but got: $ACTUAL"
            exit 1
          fi
      - name: Assert neko is available
        run: |
          echo "Checking neko binary..."
          if ! command -v neko >/dev/null 2>&1; then
            echo "FAIL: neko not found on PATH"
            exit 1
          fi
          echo "PASS: neko found on PATH"
          neko -version 2>&1 || true
