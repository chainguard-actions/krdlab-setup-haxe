name: Test default Haxe version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-haxe
        uses: .
        with:
          haxe-version: '4.3.7'
      - name: Assert haxe is available with default version
        run: |
          echo "Checking haxe is available..."
          if ! command -v haxe >/dev/null 2>&1; then
            echo "FAIL: haxe not found on PATH"
            exit 1
          fi
          ACTUAL_VERSION=$(haxe --version 2>&1 | head -1)
          echo "actual version: $ACTUAL_VERSION"
          if ! echo "$ACTUAL_VERSION" | grep -q "4.3.7"; then
            echo "FAIL: expected default version 4.3.7 but got: $ACTUAL_VERSION"
            exit 1
          fi
          echo "PASS: default haxe version 4.3.7 is installed"
      - name: Assert neko is available
        run: |
          echo "Checking neko is available..."
          if ! command -v neko >/dev/null 2>&1; then
            echo "FAIL: neko not found on PATH"
            exit 1
          fi
          echo "PASS: neko found on PATH"
